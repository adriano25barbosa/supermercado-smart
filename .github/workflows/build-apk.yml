name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk supermercado-smart.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" supermercado-smart.apk \
            --target "${{ github.sha }}" \
            --title "Supermercado Smart - build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --latest